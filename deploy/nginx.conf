# nginx vhost for the CRM import converter.
#
# Use a dedicated hostname with `location /`, NOT a sub-path: the frontend calls
# absolute URLs (/api/upload, /download/..., /static/...), so mounting it under
# /crm-import/ breaks without also threading SCRIPT_NAME through the app.
#
#   htpasswd -c /etc/nginx/.htpasswd-crmimport <user>
#   cp deploy/nginx.conf /etc/nginx/sites-available/crm-import && nginx -t

limit_req_zone $binary_remote_addr zone=crm_upload:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=crm_api:10m   rate=60r/m;
limit_conn_zone $binary_remote_addr zone=crm_conn:10m;

server {
    listen 80;
    server_name crm-import.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name crm-import.example.com;

    ssl_certificate     /etc/letsencrypt/live/crm-import.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm-import.example.com/privkey.pem;

    # The service has no authentication of its own and handles customer contact
    # details. This is the only thing standing in front of it - do not remove it.
    auth_basic "CRM import";
    auth_basic_user_file /etc/nginx/.htpasswd-crmimport;

    # Must match MAX_CONTENT_LENGTH in the app, or nginx returns an HTML 413 the
    # frontend cannot parse as JSON.
    client_max_body_size 8m;
    client_body_timeout  60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /healthz {
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:5101;
    }

    location /api/ {
        limit_req  zone=crm_upload burst=4 nodelay;
        limit_conn crm_conn 2;

        proxy_pass         http://127.0.0.1:5101;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Parsing is synchronous and blocking: a table at the size limit takes
        # tens of seconds, and a 60s default would 504 halfway through.
        proxy_connect_timeout 5s;
        proxy_read_timeout  180s;
        proxy_send_timeout  180s;
    }

    location / {
        limit_req  zone=crm_api burst=20 nodelay;
        proxy_pass         http://127.0.0.1:5101;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
